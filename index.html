
<html >
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Live News Website</title>
 <link rel="stylesheet" href="index.css">
</head>
<body>
<!-- HEADER -->
<header>
<h1>📰 Live News</h1>
<p>Latest News Updates</p>
</header>
<!-- BREAKING NEWS -->
<div class="breaking">
<span id="breakingText">
🔴 Breaking News Loading...
</span>
</div>
<!-- CATEGORIES -->
<div class="categories">
<button onclick="loadCategory('India')">
🇮🇳 India
</button>
<button onclick="loadCategory('cricket')">
🏏 Sports
</button>
<button onclick="loadCategory('technology')">
💻 Technology
</button>
<button onclick="loadCategory('movies')">
🎬 Entertainment
</button>
<button onclick="loadNews()">
📰 Latest
</button>
</div>
<!-- SEARCH -->
<div class="search-box">
<input
type="text"
id="searchInput"
placeholder="🔎 Search news...">
<button onclick="searchNews()">
Search
</button>
<button
class="voice"
onclick="startVoice()"
title="Voice Search">
🎙️
</button>
<!--language-->
    <select id="language" onchange="changelanguage()">
        <option value="lang">language</option>
        <option value="en">English</option>
        <option value="te">Telugu</option>
        <option value="hi">Hindi</option>
    </select>
    <h2 id="text"></h2>
</div>

<!-- STATUS -->
<div id="message">
Loading news...
</div>
<!-- SLIDER -->
<div class="slider">
<div id="sliderContainer">
</div>
<button
class="prev"
onclick="previousSlide()">
❮
</button>
<button
class="next"
onclick="nextSlide()">
❯
</button>
<div
class="dots"
id="dots">
</div>
</div>
<!-- TITLE -->
<h2 class="news-title">
Latest News
</h2>
<!-- NEWS -->
<div
id="newsContainer"
class="news-container">
</div>
<!-- FOOTER -->
<footer>
<h2>📰 Live News</h2>
<p>
Powered by NewsAPI
</p>
</footer>
<script src="index.js"></script>
</body>
</html>
